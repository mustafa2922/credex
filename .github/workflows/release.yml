
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # electron-builder 26 creates a published release and does not tell
      # GitHub which commit the tag belongs to. GitHub rejects that with
      # 422 unless the tag already exists on credex-releases. A tag on
      # this source repo does not count. Create the release first; the
      # publisher then only uploads the installer.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = "mustafa2922/credex-releases"
          gh release view $tag --repo $repo
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists"
          } else {
            gh release create $tag --repo $repo --target main --title $version --notes "credex $version"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}